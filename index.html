<script>

// WORD COUNTER
function doWord(){
let t=document.getElementById("wordIn").value.trim();
let w=t?t.split(/\s+/).length:0;
document.getElementById("wordRes").innerText="Total Words: "+w;
}

// SMART HASHTAG GENERATOR
function doTags(){
let topic=document.getElementById("tagIn").value.trim().toLowerCase();
if(!topic) return;

const baseTags = [
"#viral","#trending","#explorepage","#growth",
"#contentcreator","#india","#success","#creatorlife"
];

const nicheTags = [
"#"+topic,
"#"+topic+"tips",
"#"+topic+"life",
"#"+topic+"growth",
"#"+topic+"daily",
"#"+topic+"reels",
"#"+topic+"content",
"#"+topic+"community"
];

// shuffle
let all = nicheTags.concat(baseTags)
.sort(()=>0.5-Math.random())
.slice(0,10)
.join(" ");

document.getElementById("tagRes").innerText = all;
}

// SMART CAPTION GENERATOR
function doCaption(){
let topic=document.getElementById("capIn").value.trim();
if(!topic) return;

const captions = [
"Success in "+topic+" comes from daily discipline 🚀",
"Nobody talks about this in "+topic+" 😳",
"If you are serious about "+topic+", read this 👇",
"Consistency beats talent in "+topic+" 🔥",
"This is how I improved my "+topic+" game 💯"
];

document.getElementById("capRes").innerText =
captions[Math.floor(Math.random()*captions.length)];
}

// SMART BIO GENERATOR
function doBio(){
let niche=document.getElementById("bioIn").value.trim();
if(!niche) return;

const bios = [
"🚀 Growing in "+niche+"\n🔥 Daily value\n📈 Learn & build",
"🎯 "+niche+" Creator\n💡 Sharing insights\n🚀 Follow for growth",
"🔥 Helping you master "+niche+"\n📊 Smart content\n🎯 Results matter",
"💥 "+niche+" Hustler\n📘 Practical knowledge\n🚀 Level up daily"
];

document.getElementById("bioRes").innerText =
bios[Math.floor(Math.random()*bios.length)];
}

// SMART REEL HOOK
function doHook(){
let topic=document.getElementById("hookIn").value.trim();
if(!topic) return;

const hooks = [
"Stop scrolling! "+topic+" secret revealed 🔥",
"This mistake ruins your "+topic+" growth 🤯",
"Nobody tells you this about "+topic+" 😳",
"If you care about "+topic+", watch this 👀",
"This changed my "+topic+" strategy completely 🚀"
];

document.getElementById("hookRes").innerText =
hooks[Math.floor(Math.random()*hooks.length)];
}

// COPY
function copyText(id){
let text=document.getElementById(id).innerText;
navigator.clipboard.writeText(text);
}
</script>
