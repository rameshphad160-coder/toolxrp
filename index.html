<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolxRP - Professional Content Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        nav { background: #1e293b; color: white; padding: 1rem 5%; text-align: center; font-weight: 700; font-size: 1.8rem; }
        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .tool-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .card { background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; display: flex; flex-direction: column; }
        h2 { font-size: 1.1rem; margin-top: 0; color: var(--primary); border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        textarea, input { width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 6px; font-size: 0.9rem; box-sizing: border-box; outline: none; margin-bottom: 10px; }
        .btn { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .btn:hover { background: #1d4ed8; }
        .result-box { margin-top: 10px; padding: 10px; background: #f1f5f9; border-radius: 6px; font-size: 0.85rem; display: none; min-height: 40px; }
        .footer { text-align: center; padding: 40px; color: #64748b; }
    </style>
</head>
<body>

<nav>ToolxRP</nav>

<div class="container">
    <div class="tool-grid">
        
        <div class="card">
            <h2>📝 Word & Char Counter</h2>
            <textarea id="wordInput" rows="4" placeholder="Type or paste text..."></textarea>
            <button class="btn" onclick="analyzeText()">Analyze Text</button>
            <div id="wordResult" class="result-box"></div>
        </div>

        <div class="card">
            <h2># Hashtag Generator</h2>
            <input type="text" id="tagInput" placeholder="Enter topic (e.g. Gym, Travel)">
            <button class="btn" onclick="generateTags()">Generate Tags</button>
            <div id="tagResult" class="result-box"></div>
        </div>

        <div class="card">
            <h2>✍️ Caption Generator</h2>
            <input type="text" id="capInput" placeholder="What is your photo about?">
            <button class="btn" onclick="generateCaption()">Get Caption</button>
            <div id="capResult" class="result-box"></div>
        </div>

        <div class="card">
            <h2>🔄 Paraphraser</h2>
            <textarea id="paraInput" rows="4" placeholder="Paste sentence to rewrite..."></textarea>
            <button class="btn" onclick="paraphraseText()">Rewrite Now</button>
            <div id="paraResult" class="result-box"></div>
        </div>

    </div>
</div>

<div class="footer">
    © 2026 ToolxRP | All Tools Active
</div>

<script>
    // Analyze Text
    function analyzeText() {
        let text = document.getElementById("wordInput").value.trim();
        let words = text ? text.split(/\s+/).length : 0;
        let res = document.getElementById("wordResult");
        res.style.display = "block";
        res.innerHTML = `Words: ${words} | Characters: ${text.length}`;
    }

    // Hashtag Logic
    function generateTags() {
        const input = document.getElementById("tagInput").value.toLowerCase().trim();
        const res = document.getElementById("tagResult");
        const bank = {
            "gym": ["#fitness", "#workout", "#gymmotivation", "#health", "#bodybuilding"],
            "travel": ["#adventure", "#explore", "#nature", "#travelgram", "#trip"],
            "tech": ["#ai", "#coding", "#future", "#gadgets", "#innovation"]
        };
        let tags = bank[input] || ["#trending", "#viral", "#foryou", "#explorepage", "#popular"];
        res.style.display = "block";
        res.innerHTML = tags.sort(() => 0.5 - Math.random()).join(" ");
    }

    // Caption Logic
    function generateCaption() {
        const res = document.getElementById("capResult");
        const caps = ["Keep shining!", "Living my best life.", "Focus on the good.", "Stay humble, hustle hard.", "Dream big, work harder."];
        res.style.display = "block";
        res.innerHTML = caps[Math.floor(Math.random() * caps.length)];
    }

    // Paraphraser Logic (Simple Example)
    function paraphraseText() {
        let text = document.getElementById("paraInput").value;
        let res = document.getElementById("paraResult");
        res.style.display = "block";
        res.innerHTML = "Rewritten: " + text.replace("good", "excellent").replace("happy", "joyful").replace("hard", "challenging");
    }
</script>

</body>
</html>
