<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolxRP - Ultimate Content Creator Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        nav { background: #1e293b; color: white; padding: 1rem 5%; text-align: center; font-weight: 700; font-size: 1.5rem; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .tool-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .card { background: var(--card); padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        h2 { font-size: 1.25rem; margin-bottom: 15px; color: var(--primary); }
        textarea, input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1rem; box-sizing: border-box; outline: none; transition: 0.3s; }
        textarea:focus, input:focus { border-color: var(--primary); }
        .btn { background: var(--primary); color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 1rem; margin-top: 15px; transition: 0.3s; }
        .btn:hover { background: #1d4ed8; transform: translateY(-2px); }
        .result-box { margin-top: 20px; padding: 15px; background: #f1f5f9; border-radius: 8px; border-left: 5px solid var(--primary); font-size: 0.95rem; display: none; word-wrap: break-word; }
        .footer { text-align: center; padding: 40px; color: #64748b; }
    </style>
</head>
<body>

<nav>ToolxRP</nav>

<div class="container">
    <div class="tool-grid">
        <div class="card">
            <h2>📝 Word Counter</h2>
            <textarea id="wordInput" rows="5" placeholder="Paste your text here..."></textarea>
            <button class="btn" onclick="countWords()">Analyze Text</button>
            <div id="wordResult" class="result-box"></div>
        </div>

        <div class="card">
            <h2># Hashtag Generator</h2>
            <input type="text" id="tagInput" placeholder="Enter topic (e.g. Travel, Gym, AI)">
            <button class="btn" onclick="generateTags()">Generate Unlimited Tags</button>
            <div id="tagResult" class="result-box"></div>
        </div>
    </div>
</div>

<div class="footer">
    © 2026 ToolxRP | Professional Content Tools
</div>

<script>
    // Word Counter Logic
    function countWords() {
        let text = document.getElementById("wordInput").value.trim();
        let words = text ? text.split(/\s+/).length : 0;
        let characters = text.length;
        let res = document.getElementById("wordResult");
        res.style.display = "block";
        res.innerHTML = `<strong>Words:</strong> ${words} <br> <strong>Characters:</strong> ${characters}`;
    }

    // Unlimited Hashtag Logic
    function generateTags() {
        const input = document.getElementById("tagInput").value.toLowerCase().trim();
        const res = document.getElementById("tagResult");
        
        // Huge Database of Tags
        const tagBank = {
            "travel": ["#travel", "#nature", "#adventure", "#explore", "#wanderlust", "#travelgram", "#landscape", "#trip", "#vacation", "#beautifullocations", "#travelblogger", "#world", "#tourism"],
            "gym": ["#fitness", "#workout", "#gymlife", "#motivation", "#health", "#bodybuilding", "#training", "#fitfam", "#lifestyle", "#muscle", "#exercise", "#gymmotivation"],
            "tech": ["#technology", "#coding", "#ai", "#innovation", "#gadgets", "#software", "#developer", "#programming", "#future", "#techworld", "#datascience", "#cybersecurity"],
            "food": ["#foodie", "#yummy", "#instafood", "#cooking", "#delicious", "#foodstagram", "#healthyfood", "#dinner", "#chef", "#foodlover", "#breakfast"],
            "business": ["#marketing", "#success", "#entrepreneur", "#money", "#growth", "#startup", "#branding", "#digitalmarketing", "#mindset", "#smallbusiness"]
        };

        let baseTags = tagBank[input] || ["#trending", "#viral", "#foryou", "#explorepage", "#instagood", "#popular", "#follow", "#like", "#bestoftheday"];
        
        // Mix and Shuffle Tags (To prevent repeats and make them unlimited)
        let shuffled = baseTags.sort(() => 0.5 - Math.random());
        let finalTags = shuffled.slice(0, 15).join(" "); // Shows 15 random tags each time

        res.style.display = "block";
        res.innerHTML = `<strong>Generated Tags:</strong><br><br>${finalTags}`;
    }
</script>

</body>
</html>
